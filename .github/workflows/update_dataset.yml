name: Scheduled Dataset Refresh & Auto-Sync

on:
  schedule:
    # Runs every Monday at 06:00 UTC (automated background execution)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  refresh-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraping & Dataset Pipeline
        run: |
          python pipeline.py

      - name: Commit & Push Updated Dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add dist/ preview/
          git diff-index --quiet HEAD || git commit -m "chore(data): auto-refresh verified SaaS dataset [skip ci]"
          git push
